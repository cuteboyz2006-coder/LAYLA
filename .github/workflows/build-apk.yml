name: Build Layla APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libffi-dev zlib1g-dev libgdbm-dev libncurses5-dev libncursesw5-dev libreadline-dev snapd libffi7 libltdl-dev pkg-config autoconf automake libtool ccache gettext zip unzip openjdk-17-jdk

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer setuptools

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Layla-debug.apk
          path: bin/*.apk
